name: contract-management

x-contract-environment: &contract-environment
  env_file:
    - ${CONTRACT_RUNTIME_ENV_FILE:-./.env.local}
  environment:
    MYSQL_DSN: contract:${CONTRACT_MYSQL_PASSWORD}@tcp(contract-mysql:3306)/contract_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
    PLATFORM_BASE_URL: http://platform-api:8080
    OIDC_BACKCHANNEL_BASE_URL: ${CONTRACT_KEYCLOAK_BACKCHANNEL_BASE_URL:-http://keycloak:8080}
    TEMPORAL_ADDRESS: temporal:7233
    PROJECT_API_BASE_URL: http://project-api:8082
    CONTRACT_PROCESS_MODE: split
    CONTRACT_RUN_WORKER_WITH_API: "false"
    GIN_MODE: release

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: contract_management
      MYSQL_USER: contract
      MYSQL_PASSWORD: ${CONTRACT_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CONTRACT_MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init/000_databases.sql:/docker-entrypoint-initdb.d/000_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucontract -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases:
          - contract-mysql
    restart: unless-stopped

  migrate:
    <<: *contract-environment
    build:
      context: .
    image: contract-management:local
    command: ["./migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_SEEDS: mysql
      MYSQL_USER: contract
      MYSQL_PWD: ${CONTRACT_MYSQL_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    <<: *contract-environment
    env_file:
      - ${CONTRACT_RUNTIME_ENV_FILE:-./.env.local}
      - path: runtime/license-contract-api.env
        required: false
    volumes:
      - license-state-contract-api:/var/lib/commercial-license
      - ${PLATFORM_LICENSE_PUBLIC_KEY_PATH:-../platform/data/keys/jwt-ed25519-public.pem}:/app/data/keys/jwt-ed25519-public.pem:ro
    build:
      context: .
    image: contract-management:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    expose:
      - "8081"
    networks:
      default:
      portal:
        aliases:
          - contract-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *contract-environment
    env_file:
      - ${CONTRACT_RUNTIME_ENV_FILE:-./.env.local}
      - path: runtime/license-contract-worker.env
        required: false
    volumes:
      - license-state-contract-worker:/var/lib/commercial-license
      - ${PLATFORM_LICENSE_PUBLIC_KEY_PATH:-../platform/data/keys/jwt-ed25519-public.pem}:/app/data/keys/jwt-ed25519-public.pem:ro
    image: contract-management:local
    build:
      context: .
    command: ["./worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    networks:
      default:
      portal:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/readyz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    stop_grace_period: 40s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.52.1
    profiles: ["tools"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233

volumes:
  license-state-contract-api:
  license-state-contract-worker:
  mysql-data:

networks:
  portal:
    external: true
    name: ${PLATFORM_DOCKER_NETWORK:-basic-platform-local_default}
